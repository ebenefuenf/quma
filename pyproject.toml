[project]
name = "quma"
dynamic = ["version"]
description = "A SQL/database library"
keywords = ["sql", "database"]
authors = [
    {name = "ebene fünf GmbH", email = "info@ebenefuenf.de"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "MIT"
license-files = ["LICENSE.rst", "AUTHORS"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database :: Front-Ends",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "anyio"]
docs = ["sphinx", "sphinx-autobuild"]
dev = ["ruff", "ty==0.0.92"]
templates = ["mako"]
psycopg2 = ["psycopg2"]
psycopg = ["psycopg"]
mysqlclient = ["mysqlclient"]

[project.urls]
Homepage = "https://github.com/ebenefuenf/quma"
Issues = "https://github.com/ebenefuenf/quma/issues"
Documentation = "https://quma.readthedocs.io"

[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "quma"

[tool.flit.sdist]
include = ["docs/", "CHANGES.rst", "tox.ini"]
exclude = ["docs/_build/"]

[tool.pytest.ini_options]
addopts = "--verbose -s"
markers = ["mysql", "postgres"]
testpaths = ["quma/tests"]
# Warnings raised during garbage collection arrive as unraisable exceptions.
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["quma"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no-cover",
    "raise NotImplementedError",
    "except ImportError",
]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints",
    ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache",
    ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out",
    "build", "dist", "node_modules", "site-packages", "venv",
]
line-length = 79
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "Q", "I", "C90", "W", "UP"]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["B018"] # Ignore useless expression error in tests

[tool.ty.terminal]
error-on-warning = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
