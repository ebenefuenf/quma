name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
          MARIADB_MYSQL_LOCALHOST_USER: 1
          MARIADB_MYSQL_LOCALHOST_GRANTS: USAGE
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: quma_test_db
          MARIADB_USER: quma_test_user
          MARIADB_PASSWORD: quma_test_password
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      max-parallel: 1
      matrix:
        tox: [py311, py312, py313, py314, py315]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tags, so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Run linter and tests
        run: uvx --with tox-uv tox run -e ${{ matrix.tox }}
        env:
          QUMA_PGSQL_USER: postgres
          QUMA_PGSQL_PASS: postgres
          QUMA_PGSQL_DB: postgres
          QUMA_PGSQL_HOST: localhost
          QUMA_PGSQL_PORT: 5432
