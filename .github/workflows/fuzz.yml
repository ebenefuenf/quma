name: Fuzz

# Checks the placeholder conversion against the latest server releases,
# also weekly to catch changes in new releases.
on:
  push:
    branches:
      - main
    paths: &paths
      - quma/placeholders.py
      - quma/tests/test_placeholders_fuzz.py
      - .github/workflows/fuzz.yml
  pull_request:
    paths: *paths
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: quma_test_db
          MYSQL_USER: quma_test_user
          MYSQL_PASSWORD: quma_test_password
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: root_password
          MARIADB_DATABASE: quma_test_db
          MARIADB_USER: quma_test_user
          MARIADB_PASSWORD: quma_test_password
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3307:3306
    env:
      QUMA_PGSQL_USER: postgres
      QUMA_PGSQL_PASS: postgres
      QUMA_PGSQL_DB: postgres
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tags, so pin the full version.
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Fuzz with PostgreSQL and MySQL
        run: >-
          uv run --extra test --extra psycopg2 --extra mysqlclient
          pytest quma/tests/test_placeholders_fuzz.py
          --hypothesis-profile=fuzz
      - name: Fuzz with MariaDB
        run: >-
          uv run --extra test --extra psycopg2 --extra mysqlclient
          pytest -m mysql quma/tests/test_placeholders_fuzz.py
          --hypothesis-profile=fuzz
        env:
          QUMA_MYSQL_PORT: 3307
